[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenable-ingestion"
version = "1.0.0"
requires-python = ">=3.11"

[project.scripts]
tenable-ingestion = "ingestion.cli:main"

[tool.setuptools]
packages = ["ingestion"]
include-package-data = true

[tool.setuptools.package-data]
ingestion = ["sql/*.sql"]
