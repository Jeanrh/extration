# Alembic — schema do pipeline de ingestão.
#
# O DDL propriamente dito NÃO vive nas revisões: vive em migrations/sql/*.sql,
# e as revisões só executam esses arquivos. Assim existe uma fonte de verdade
# só, e `python -m ingestion.cli init-db` (usado em banco local e nos testes)
# aplica exatamente o mesmo schema que a produção.
#
# A URL vem de PG_DSN em tempo de execução (migrations/env.py); deixá-la aqui
# significaria credencial em arquivo versionado.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
