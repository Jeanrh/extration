apiVersion: batch/v1
kind: CronJob
metadata:
  name: tenable-ingestion-reconciliation
spec:
  schedule: "0 12 * * 0"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          serviceAccountName: tenable-ingestion
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconciliation
              image: tenable-ingestion:latest
              args: ["reconcile", "--output", "-"]
              envFrom:
                - configMapRef:
                    name: tenable-ingestion-config
              env:
                - name: TENABLE_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: tenable-ingestion-secret
                      key: TENABLE_BUCKET
                - name: PG_DSN
                  valueFrom:
                    secretKeyRef:
                      name: tenable-ingestion-secret
                      key: PG_DSN
                - name: TMPDIR
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "1"
                  memory: 1Gi
                  ephemeral-storage: 4Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
