services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tenable_ingestion_test
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenable_ingestion_test"]
      interval: 2s
      timeout: 5s
      retries: 15
